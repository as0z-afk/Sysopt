<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="sysopt — portable, reversible system tuning">
  <title>sysopt</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f81f7"/>
      <stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="4" fill="url(#mark)"/>

  <!-- mark -->
  <g transform="translate(72,84)">
    <rect width="152" height="152" rx="34" fill="url(#mark)"/>
    <path d="M40 58 L70 88 L40 118" fill="none" stroke="#ffffff" stroke-width="11"
          stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="82" y1="118" x2="116" y2="118" stroke="#ffffff" stroke-width="11" stroke-linecap="round"/>
    <path d="M118 40 a34 34 0 1 0 10 26" fill="none" stroke="#9ee7a8" stroke-width="7"
          stroke-linecap="round" opacity="0.95"/>
    <path d="M118 24 v16 h-16" fill="none" stroke="#9ee7a8" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  </g>

  <!-- wordmark -->
  <text x="268" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="76" font-weight="700" fill="#e6edf3" letter-spacing="-2">sysopt</text>

  <text x="270" y="196" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="27" fill="#8b949e">portable, reversible system tuning for any OS</text>

  <!-- chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">
    <rect x="270" y="222" width="112" height="38" rx="19" fill="#1f6feb" opacity="0.18" stroke="#2f81f7" stroke-width="1.5"/>
    <text x="292" y="248" fill="#79c0ff">plan</text>

    <rect x="394" y="222" width="122" height="38" rx="19" fill="#1f6feb" opacity="0.18" stroke="#2f81f7" stroke-width="1.5"/>
    <text x="416" y="248" fill="#79c0ff">apply</text>

    <rect x="528" y="222" width="152" height="38" rx="19" fill="#1f6feb" opacity="0.18" stroke="#2f81f7" stroke-width="1.5"/>
    <text x="550" y="248" fill="#79c0ff">verify</text>

    <rect x="692" y="222" width="158" height="38" rx="19" fill="#3fb950" opacity="0.16" stroke="#3fb950" stroke-width="1.5"/>
    <text x="714" y="248" fill="#7ee787">revert</text>
  </g>

  <!-- platforms -->
  <text x="970" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="22" fill="#8b949e" text-anchor="middle">linux · macos · bsd</text>
  <text x="970" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="22" fill="#8b949e" text-anchor="middle">chromeos · windows</text>
  <text x="970" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="18" fill="#6e7681" text-anchor="middle">x86_64 · i686 · arm · arm64</text>
  <text x="970" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="18" fill="#6e7681" text-anchor="middle">ppc64le · s390x · riscv64</text>
</svg>
