name: Platform report
description: "I ran sysopt on a platform the compatibility table does not cover"
labels: ["platform"]
body:
  - type: markdown
    attributes:
      value: |
        The most useful issue this project gets. Two commands, no root, no writes.
  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: FreeBSD 14.1, RISC-V; or macOS 15.2 on Apple silicon
    validations: { required: true }
  - type: textarea
    id: detect
    attributes:
      label: "`sysopt detect`"
      render: text
    validations: { required: true }
  - type: textarea
    id: plan
    attributes:
      label: "`sysopt plan`"
      description: "If `plan` fails, paste the error instead — that is the bug."
      render: text
    validations: { required: true }
  - type: textarea
    id: tests
    attributes:
      label: "`sh tests/run_tests.sh` result (optional but very welcome)"
      render: text
    validations: { required: false }
