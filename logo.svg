<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="sysopt logo">
  <title>sysopt</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f81f7"/>
      <stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
  </defs>
  <!-- rounded shell -->
  <rect x="4" y="4" width="88" height="88" rx="20" fill="url(#g)"/>
  <!-- a terminal prompt: the thing you actually type into -->
  <path d="M24 34 L38 48 L24 62" fill="none" stroke="#fff" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="44" y1="62" x2="70" y2="62" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <!-- the revert arrow: what makes this tool different -->
  <path d="M72 26 a22 22 0 1 0 6 16" fill="none" stroke="#9ee7a8" stroke-width="4"
        stroke-linecap="round" opacity="0.9"/>
  <path d="M72 18 v10 h-10" fill="none" stroke="#9ee7a8" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
</svg>
